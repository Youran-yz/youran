<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>书库 · 在线阅读</title>
<meta name="description" content="一间小小的书库：《月亮与六便士》（中英双语全文）、《活着》（简介与摘录）。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='36' fill='%23e8c96a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  var w = window.innerWidth;
  var ua = navigator.userAgent || '';
  var mobile = w <= 768 || /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(ua);
  document.documentElement.setAttribute('data-device', mobile ? 'mobile' : 'desktop');
})();
</script>
<style>
:root{
  --bg:#ffffff;
  --bg-soft:#f7f7fb;
  --text:#101018;
  --text-soft:#5a5f73;
  --line:#e8e9f0;
  --accent:#4f5ae0;
  --accent-soft:#eef0ff;
  --gold:#c9973a;
  --gold-soft:#fdf6e6;
  --radius:16px;
  --maxw:1040px;
  --ease:cubic-bezier(.22,1,.36,1);
  --sans:'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --serif:'Noto Serif SC','Songti SC','SimSun',Georgia,serif;
}
html[data-theme="dark"]{
  --bg:#0a0b13;
  --bg-soft:#12131d;
  --text:#f1f2f7;
  --text-soft:#9aa0b4;
  --line:#22242f;
  --accent:#8f97ff;
  --accent-soft:#171a2e;
  --gold:#e3b25e;
  --gold-soft:#1d1a10;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background .4s var(--ease),color .4s var(--ease);
}
a{color:inherit;text-decoration:none}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 24px}

/* ---------- Header ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  border-bottom:1px solid transparent;
  transition:border-color .3s var(--ease),background .4s var(--ease);
}
header.scrolled{border-bottom-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:700;font-size:1.02rem;letter-spacing:.02em;display:flex;align-items:center;gap:9px;font-family:var(--serif)}
.logo .dot{
  width:10px;height:10px;border-radius:50%;background:var(--gold);
  box-shadow:0 0 0 4px var(--gold-soft);
  animation:pulse 2.6s var(--ease) infinite;
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.nav-right{display:flex;align-items:center;gap:10px}
.icon-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--text);cursor:pointer;
  display:grid;place-items:center;font-size:15px;
  transition:transform .3s var(--ease),border-color .3s var(--ease);
}
button.icon-btn:hover{transform:rotate(35deg);border-color:var(--accent)}
a.icon-btn:hover{transform:translateY(-2px);border-color:var(--accent)}
a.icon-btn svg{width:17px;height:17px;fill:currentColor}

/* ---------- Hero ---------- */
.lib-hero{
  text-align:center;
  padding:158px 24px 78px;
  position:relative;
}
.lib-hero::before{
  content:'';position:absolute;top:-14%;left:50%;transform:translateX(-50%);
  width:680px;height:520px;
  background:radial-gradient(ellipse,var(--accent-soft) 0%,transparent 68%);
  filter:blur(30px);z-index:-1;pointer-events:none;
  animation:floatBg 14s ease-in-out infinite;
}
@keyframes floatBg{0%,100%{transform:translate(-50%,0)}50%{transform:translate(calc(-50% + 30px),26px)}}
.lib-hero h1{
  font-family:var(--serif);
  font-size:clamp(2.6rem,7vw,4rem);
  letter-spacing:.1em;
  font-weight:700;
  line-height:1.2;
}
.lib-sub{color:var(--text-soft);margin-top:16px;font-size:1.02rem;letter-spacing:.04em}
.lib-meta{
  margin-top:26px;font-size:.78rem;letter-spacing:.22em;
  text-transform:uppercase;color:var(--text-soft);
}
.lib-meta b{color:var(--gold);font-weight:600}

/* ---------- Book grid ---------- */
.library{padding:20px 24px 40px}
.book-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(290px,1fr));
  gap:56px 44px;
  max-width:820px;
  margin:0 auto;
}
.book-card{
  display:flex;flex-direction:column;align-items:center;
  gap:24px;text-align:center;
  cursor:pointer;
}
.bc-cover{
  position:relative;overflow:hidden;
  width:100%;max-width:280px;
  aspect-ratio:2/3;border-radius:6px 14px 14px 6px;
  container-type:inline-size;
  box-shadow:0 26px 50px -24px rgba(10,12,30,.5);
  transition:transform .55s var(--ease),box-shadow .55s var(--ease);
}
.book-card:hover .bc-cover{
  transform:translateY(-8px) rotate(-.6deg);
  box-shadow:0 36px 64px -26px rgba(10,12,30,.6);
}
.bc-shine{
  position:absolute;inset:0;z-index:4;pointer-events:none;
  background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.1) 46%,transparent 62%);
  transform:translateX(-130%);transition:transform .9s var(--ease);
}
.book-card:hover .bc-shine{transform:translateX(130%)}
.bc-title{
  position:absolute;left:0;right:0;text-align:center;
  color:#f2ead2;font-family:var(--serif);font-weight:600;
  letter-spacing:.1em;line-height:1.4;
}
.bc-author{
  position:absolute;left:0;right:0;text-align:center;
  color:rgba(242,234,210,.62);font-family:var(--serif);
  letter-spacing:.34em;text-indent:.34em;
}

/* moon cover */
.bc-cover.moon{background:linear-gradient(155deg,#161c3e 0%,#0d1128 55%,#0a0d1e 100%)}
.bc-cover.moon::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:12px;z-index:2;
  background:linear-gradient(90deg,rgba(255,255,255,.13),rgba(255,255,255,0));
}
.bc-stars{position:absolute;inset:0;
  background-image:
    radial-gradient(1.6px 1.6px at 16% 14%,rgba(255,255,255,.85),transparent),
    radial-gradient(1.3px 1.3px at 76% 9%,rgba(255,255,255,.7),transparent),
    radial-gradient(1.7px 1.7px at 64% 26%,rgba(255,255,255,.6),transparent),
    radial-gradient(1.2px 1.2px at 24% 36%,rgba(255,255,255,.5),transparent),
    radial-gradient(1.5px 1.5px at 86% 44%,rgba(255,255,255,.55),transparent),
    radial-gradient(1.2px 1.2px at 10% 56%,rgba(255,255,255,.45),transparent),
    radial-gradient(1.5px 1.5px at 42% 7%,rgba(255,255,255,.6),transparent);
}
.bc-moon{
  position:absolute;top:10%;left:50%;transform:translateX(-50%);
  width:40cqw;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 38% 32%,#fdf7e6,#f2e6c2 55%,#ddc996 100%);
  box-shadow:0 0 46px 10px rgba(245,234,208,.3),0 0 90px 30px rgba(245,234,208,.12);
}
.bc-cover.moon .bc-title{bottom:31%;font-size:38px;font-size:12.5cqw}
.bc-cover.moon .bc-author{bottom:22%;font-size:12px;font-size:4.1cqw}

/* huozhe cover */
.bc-cover.hz{background:linear-gradient(168deg,#2b0a0a 0%,#571410 52%,#7d2418 100%)}
.bc-cover.hz::before{
  content:'';position:absolute;left:0;top:0;bottom:0;width:12px;z-index:2;
  background:linear-gradient(90deg,rgba(255,235,210,.14),rgba(255,235,210,0));
}
.hz-frame{
  position:absolute;inset:5.5%;z-index:3;
  border:1px solid rgba(255,235,210,.22);border-radius:2px;
}
.hz-sun{
  position:absolute;top:11%;left:50%;transform:translateX(-50%);
  width:50cqw;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 40% 34%,#ffd98d,#e8843f 58%,#b84a24);
  box-shadow:0 0 56px 14px rgba(232,132,63,.34);
}
.bc-cover.hz .bc-title{bottom:33%;font-size:60px;font-size:20cqw;letter-spacing:.16em}
.bc-cover.hz .bc-author{bottom:23%;font-size:12px;font-size:4cqw}

/* info */
.bc-info h2{
  font-family:var(--serif);font-size:1.32rem;font-weight:700;
  letter-spacing:.04em;margin-bottom:8px;
  transition:color .3s var(--ease);
}
.book-card:hover .bc-info h2{color:var(--accent)}
.bc-line{color:var(--text-soft);font-size:.84rem;letter-spacing:.02em;margin-bottom:10px}
.bc-desc{color:var(--text-soft);font-size:.9rem;margin-bottom:16px}
.bc-tags{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.bc-tags span{
  font-size:.74rem;color:var(--text-soft);
  border:1px solid var(--line);border-radius:999px;
  padding:3px 12px;background:var(--bg-soft);
  transition:border-color .3s var(--ease),color .3s var(--ease);
}
.book-card:hover .bc-tags span{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}

/* ---------- Footer ---------- */
footer{
  padding:46px 0 56px;border-top:1px solid var(--line);
  color:var(--text-soft);font-size:.84rem;margin-top:40px;
}
.foot{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.foot a{transition:color .25s var(--ease)}
.foot a:hover{color:var(--accent)}

/* ---------- Device: mobile ---------- */
[data-device="mobile"] .lib-hero{padding:128px 24px 46px}
[data-device="mobile"] .lib-meta{margin-top:18px}
[data-device="mobile"] .book-grid{grid-template-columns:1fr;gap:18px;max-width:560px}
[data-device="mobile"] .book-card{
  flex-direction:row;align-items:center;text-align:left;
  gap:16px;padding:14px;border:1px solid var(--line);
  border-radius:18px;background:var(--bg-soft);
  transition:border-color .35s var(--ease),transform .35s var(--ease);
}
[data-device="mobile"] .book-card:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));transform:translateY(-2px)}
[data-device="mobile"] .bc-cover{width:96px;max-width:96px;flex:none;border-radius:4px 10px 10px 4px}
[data-device="mobile"] .bc-info{flex:1;min-width:0}
[data-device="mobile"] .bc-info h2{font-size:1.14rem;margin-bottom:4px}
[data-device="mobile"] .bc-desc{font-size:.84rem;margin-bottom:10px}
[data-device="mobile"] .bc-tags{justify-content:flex-start;gap:6px}
[data-device="mobile"] .bc-tags span{font-size:.7rem;padding:2px 10px}
[data-device="mobile"] .book-card:hover .bc-cover{transform:none}

/* ---------- Reveal ---------- */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.reveal.in{opacity:1;transform:none}

@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  .reveal{opacity:1;transform:none}
}
</style>
</head>
<body>

<header id="hdr">
  <div class="wrap nav">
    <a href="index.html" class="logo"><span class="dot"></span>书库</a>
    <div class="nav-right">
      <a class="icon-btn" href="https://github.com/Youran-yz/youran" target="_blank" rel="noopener" aria-label="GitHub 仓库">
        <svg viewBox="0 0 16 16"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
      </a>
      <button class="icon-btn" id="themeBtn" aria-label="切换主题">◐</button>
    </div>
  </div>
</header>

<main>
  <section class="lib-hero">
    <h1 class="reveal">书库</h1>
    <p class="lib-sub reveal">把想读的书，慢慢读完。</p>
    <p class="lib-meta reveal">在架 <b>2</b> 本 · 持续添加</p>
  </section>

  <section class="library wrap">
    <div class="book-grid">

      <a class="book-card reveal" href="moon.html">
        <div class="bc-cover moon">
          <div class="bc-stars"></div>
          <div class="bc-moon"></div>
          <div class="bc-title">月亮与六便士</div>
          <div class="bc-author">毛姆</div>
          <div class="bc-shine"></div>
        </div>
        <div class="bc-info">
          <h2>月亮与六便士</h2>
          <p class="bc-line">毛姆 · W. Somerset Maugham</p>
          <p class="bc-desc">满地都是六便士，他却抬头看见了月亮。</p>
          <div class="bc-tags"><span>中英双语</span><span>全文阅读</span><span>免费下载</span></div>
        </div>
      </a>

      <a class="book-card reveal" href="huozhe.html">
        <div class="bc-cover hz">
          <div class="hz-frame"></div>
          <div class="hz-sun"></div>
          <div class="bc-title">活着</div>
          <div class="bc-author">余华</div>
          <div class="bc-shine"></div>
        </div>
        <div class="bc-info">
          <h2>活着</h2>
          <p class="bc-line">余华 · 1993</p>
          <p class="bc-desc">人是为了活着本身而活着的。</p>
          <div class="bc-tags"><span>简介</span><span>作者</span><span>摘录</span><span>正版入口</span></div>
        </div>
      </a>

    </div>
  </section>
</main>

<footer>
  <div class="wrap foot">
    <span>© 2026 书库 · 仅供学习交流</span>
    <a href="https://github.com/Youran-yz/youran" target="_blank" rel="noopener">GitHub 仓库</a>
  </div>
</footer>

<script>
(() => {
  const hdr = document.getElementById('hdr');
  const themeBtn = document.getElementById('themeBtn');

  const onScroll = () => hdr.classList.toggle('scrolled', window.scrollY > 8);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();

  const saved = localStorage.getItem('moon-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const setTheme = t => {
    document.documentElement.dataset.theme = t;
    themeBtn.textContent = t === 'dark' ? '☀' : '◐';
    localStorage.setItem('moon-theme', t);
  };
  setTheme(saved || (prefersDark ? 'dark' : 'light'));
  themeBtn.addEventListener('click', () => {
    setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  const items = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e, i) => {
        if (e.isIntersecting) {
          setTimeout(() => e.target.classList.add('in'), i * 90);
          io.unobserve(e.target);
        }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -30px 0px' });
    items.forEach(el => io.observe(el));
  } else {
    items.forEach(el => el.classList.add('in'));
  }
})();
</script>
</body>
</html>
