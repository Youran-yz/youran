<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>阅读 · 月亮与六便士</title>
<meta name="description" content="《月亮与六便士》全文在线阅读：中英双语、58 章、字号调节、深浅色模式。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='36' fill='%23e8c96a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<script>
(function(){
  var w = window.innerWidth;
  var ua = navigator.userAgent || '';
  var mobile = w <= 768 || /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(ua);
  document.documentElement.setAttribute('data-device', mobile ? 'mobile' : 'desktop');
})();
</script>
<style>
:root{
  --bg:#ffffff;
  --bg-soft:#f7f7fb;
  --text:#101018;
  --text-soft:#5a5f73;
  --line:#e8e9f0;
  --accent:#4f5ae0;
  --accent-soft:#eef0ff;
  --gold:#c9973a;
  --gold-soft:#fdf6e6;
  --ease:cubic-bezier(.22,1,.36,1);
  --sans:'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  --serif:'Noto Serif SC','Songti SC','SimSun',Georgia,serif;
}
html[data-theme="dark"]{
  --bg:#0a0b13;
  --bg-soft:#12131d;
  --text:#f1f2f7;
  --text-soft:#9aa0b4;
  --line:#22242f;
  --accent:#8f97ff;
  --accent-soft:#171a2e;
  --gold:#e3b25e;
  --gold-soft:#1d1a10;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--sans);
  background:var(--bg);
  color:var(--text);
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  transition:background .4s var(--ease),color .4s var(--ease);
}
a{color:inherit;text-decoration:none}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}

/* ---------- Header ---------- */
header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  backdrop-filter:saturate(180%) blur(16px);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  background:color-mix(in srgb,var(--bg) 78%,transparent);
  border-bottom:1px solid transparent;
  transition:border-color .3s var(--ease),background .4s var(--ease);
}
header.scrolled{border-bottom-color:var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:14px}
.logo{font-weight:700;font-size:1rem;letter-spacing:.02em;display:flex;align-items:center;gap:8px;font-family:var(--serif);flex:none}
.logo .dot{width:10px;height:10px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft);animation:pulse 2.6s var(--ease) infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
.back-arrow{display:inline-block;transition:transform .3s var(--ease)}
.logo:hover .back-arrow{transform:translateX(-4px)}
.tools{display:flex;align-items:center;gap:10px}
.lang-seg{
  display:flex;border:1px solid var(--line);border-radius:999px;
  overflow:hidden;flex:none;background:var(--bg-soft);
}
.lang-seg button{
  border:none;background:transparent;color:var(--text-soft);
  font-family:var(--sans);font-size:.78rem;font-weight:600;
  padding:0 13px;height:34px;cursor:pointer;
  transition:background .3s var(--ease),color .3s var(--ease);
}
.lang-seg button.active{background:var(--accent);color:#fff}
#chapterSelect{
  font-family:var(--sans);font-size:.85rem;color:var(--text);
  background:var(--bg-soft);border:1px solid var(--line);border-radius:999px;
  padding:8px 14px;cursor:pointer;max-width:38vw;
  transition:border-color .3s var(--ease);outline:none;
}
#chapterSelect:hover,#chapterSelect:focus{border-color:var(--accent)}
.tool-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:transparent;color:var(--text);cursor:pointer;font-size:.85rem;
  display:grid;place-items:center;flex:none;
  transition:transform .3s var(--ease),border-color .3s var(--ease),opacity .3s var(--ease);
}
.tool-btn:hover{border-color:var(--accent)}
.tool-btn:disabled{opacity:.35;cursor:not-allowed}
.progress-track{position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none}
.progress-track i{display:block;height:100%;width:0;background:var(--accent);transition:width .1s linear}

/* ---------- Article ---------- */
main{padding-top:64px}
.article{max-width:720px;margin:0 auto;padding:0 24px;font-size:18px}
.chapter-head{text-align:center;padding:60px 0 40px;border-bottom:1px solid var(--line);margin-bottom:48px}
.book-mini{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--text-soft);margin-bottom:18px}
#chapterTitle{
  font-family:var(--serif);font-size:clamp(1.6rem,4vw,2.2rem);
  letter-spacing:.05em;font-weight:600;
  transition:opacity .25s var(--ease);
}
.chapter-body{
  font-family:Georgia,'Times New Roman','Noto Serif SC',serif;
  line-height:1.9;color:var(--text);
  transition:opacity .28s var(--ease),transform .28s var(--ease);
}
.chapter-body.fading{opacity:0;transform:translateY(10px)}
.chapter-body p{animation:pIn .45s var(--ease) both}
@keyframes pIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.chapter-body.lang-en p{margin-bottom:1.15em;text-align:justify;text-justify:inter-word}
.chapter-body.lang-en p:first-child::first-letter{font-size:1.5em;float:left;line-height:1;padding:5px 9px 0 0;color:var(--gold)}
.chapter-body.lang-zh{font-family:var(--serif)}
.chapter-body.lang-zh p{
  margin-bottom:.6em;text-align:justify;
  text-indent:2em;line-height:2.05;
}

/* ---------- Pager ---------- */
.pager{
  max-width:720px;margin:70px auto 0;padding:0 24px 84px;
  display:flex;justify-content:space-between;align-items:center;gap:12px;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 22px;border-radius:999px;font-size:.88rem;font-weight:500;
  cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text);
  font-family:var(--sans);
  transition:transform .28s var(--ease),border-color .28s var(--ease),color .28s var(--ease),opacity .28s var(--ease);
}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;color:var(--text-soft)}
.btn.home{color:var(--text-soft);font-size:.82rem}

/* ---------- Footer ---------- */
.reader-foot{
  border-top:1px solid var(--line);
  text-align:center;color:var(--text-soft);font-size:.8rem;
  padding:30px 24px 52px;line-height:1.9;
}
.reader-foot a{color:var(--accent)}

/* ---------- Mobile bottom bar ---------- */
.m-bar{display:none}
[data-device="mobile"] .m-bar{
  display:flex;position:fixed;left:0;right:0;bottom:0;z-index:90;
  background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);
  border-top:1px solid var(--line);
  padding:9px 12px calc(9px + env(safe-area-inset-bottom));
  gap:8px;
}
.m-bar button{
  flex:1;height:42px;border-radius:12px;border:1px solid var(--line);
  background:transparent;color:var(--text);font-size:.86rem;font-family:var(--sans);
  cursor:pointer;
  transition:border-color .25s var(--ease),color .25s var(--ease),opacity .25s var(--ease);
}
.m-bar button:active{border-color:var(--accent);color:var(--accent)}
.m-bar button:disabled{opacity:.35}
[data-device="mobile"] .reader-foot{padding-bottom:120px}

/* ---------- Mobile tweaks ---------- */
@media(max-width:560px){
  .logo .logo-text{display:none}
  .tools{gap:6px}
  #chapterSelect{max-width:27vw;font-size:.78rem;padding:7px 8px}
  .tool-btn{width:32px;height:32px;font-size:.78rem}
  .lang-seg button{padding:0 9px;height:32px;font-size:.72rem}
  .article{padding:0 20px}
  .pager{padding:0 20px 60px}
  .pager .btn{padding:11px 16px;font-size:.82rem}
  .chapter-head{padding:44px 0 32px;margin-bottom:36px}
}
@media(prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header id="hdr">
  <div class="wrap nav">
    <a href="moon.html" class="logo"><span class="back-arrow">←</span><span class="dot"></span><span class="logo-text">月亮与六便士</span></a>
    <div class="tools">
      <div class="lang-seg" id="langSeg">
        <button data-lang="zh">中</button>
        <button data-lang="en">EN</button>
      </div>
      <select id="chapterSelect" aria-label="章节目录"></select>
      <button id="fontDec" class="tool-btn" aria-label="减小字号">A−</button>
      <button id="fontInc" class="tool-btn" aria-label="增大字号">A+</button>
      <button id="themeBtn" class="tool-btn" aria-label="切换主题">◐</button>
    </div>
  </div>
  <div class="progress-track"><i id="progressBar"></i></div>
</header>

<main>
  <article class="article" id="article">
    <header class="chapter-head">
      <p class="book-mini" id="bookMini">The Moon and Sixpence · W. Somerset Maugham</p>
      <h1 id="chapterTitle">Chapter I</h1>
    </header>
    <div id="chapterBody" class="chapter-body lang-en"></div>
  </article>

  <nav class="pager">
    <button id="prevBtn" class="btn">← 上一章</button>
    <a href="moon.html" class="btn home">返回详情</a>
    <button id="nextBtn" class="btn">下一章 →</button>
  </nav>
</main>

<footer class="reader-foot">
  <p>中文译文由 AI 翻译整理，仅供学习参考 · 原文：<a href="https://www.gutenberg.org/ebooks/222" target="_blank" rel="noopener">Project Gutenberg #222</a>（公有领域）</p>
</footer>

<nav class="m-bar" id="mBar">
  <button id="mPrev">‹ 上一章</button>
  <button id="mTop">目录 ↑</button>
  <button id="mNext">下一章 ›</button>
</nav>

<script src="./book/moon-en.js"></script>
<script src="./book/moon-zh.js"></script>
<script>
(() => {
  const EN = window.MOON_EN || null;
  const ZH = window.MOON_ZH || null;
  const books = { en: EN, zh: ZH };
  const has = l => !!(books[l] && books[l].chapters && books[l].chapters.length);

  const titleEl = document.getElementById('chapterTitle');
  const miniEl = document.getElementById('bookMini');
  const bodyEl = document.getElementById('chapterBody');
  const select = document.getElementById('chapterSelect');
  const langSeg = document.getElementById('langSeg');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const mPrev = document.getElementById('mPrev');
  const mNext = document.getElementById('mNext');
  const mTop = document.getElementById('mTop');
  const progressBar = document.getElementById('progressBar');
  const fontDec = document.getElementById('fontDec');
  const fontInc = document.getElementById('fontInc');
  const themeBtn = document.getElementById('themeBtn');
  const hdr = document.getElementById('hdr');
  const article = document.getElementById('article');

  if (!has('en') && !has('zh')) {
    bodyEl.innerHTML = '<p>章节数据加载失败，请确认 book/ 目录已正确部署。</p>';
    return;
  }

  // ---------- 主题 ----------
  const saved = localStorage.getItem('moon-theme');
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const setTheme = t => {
    document.documentElement.dataset.theme = t;
    themeBtn.textContent = t === 'dark' ? '☀' : '◐';
    localStorage.setItem('moon-theme', t);
  };
  setTheme(saved || (prefersDark ? 'dark' : 'light'));
  themeBtn.addEventListener('click', () => {
    setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
  });

  // ---------- 字号 ----------
  let size = parseInt(localStorage.getItem('moon-reader-size') || '18', 10);
  if (isNaN(size)) size = 18;
  const applySize = () => {
    article.style.fontSize = size + 'px';
    localStorage.setItem('moon-reader-size', String(size));
    fontDec.disabled = size <= 15;
    fontInc.disabled = size >= 24;
  };
  fontDec.addEventListener('click', () => { if (size > 15) { size--; applySize(); } });
  fontInc.addEventListener('click', () => { if (size < 24) { size++; applySize(); } });
  applySize();

  // ---------- 语言 ----------
  let lang = 'en';
  const savedLang = localStorage.getItem('moon-lang');
  if (savedLang && has(savedLang)) lang = savedLang;
  else if (has('zh')) lang = 'zh';

  const CN_D = ['零','一','二','三','四','五','六','七','八','九'];
  function cnNum(n) {
    if (n <= 10) return n === 10 ? '十' : CN_D[n];
    if (n < 20) return '十' + CN_D[n - 10];
    const t = Math.floor(n / 10), o = n % 10;
    return CN_D[t] + '十' + (o ? CN_D[o] : '');
  }

  const chapterLabel = (l, i) =>
    l === 'zh' ? ('第' + cnNum(i + 1) + '章') : ('Chapter ' + books[l].chapters[i].num);

  const updateSeg = () => {
    langSeg.querySelectorAll('button').forEach(b => {
      const l = b.dataset.lang;
      b.style.display = has(l) ? '' : 'none';
      b.classList.toggle('active', l === lang);
    });
  };

  const rebuildSelect = () => {
    select.innerHTML = '';
    books[lang].chapters.forEach((c, i) => {
      const o = document.createElement('option');
      o.value = String(i);
      o.textContent = chapterLabel(lang, i);
      select.appendChild(o);
    });
  };

  // ---------- 渲染 ----------
  let current = 0;
  let busy = false;

  const paint = () => {
    const list = books[lang].chapters;
    const c = list[current];
    titleEl.textContent = chapterLabel(lang, current);
    miniEl.textContent = lang === 'zh'
      ? '月亮与六便士 · 毛姆'
      : 'The Moon and Sixpence · W. Somerset Maugham';
    bodyEl.innerHTML = c.paras.map((p, k) =>
      '<p style="animation-delay:' + Math.min(k * 24, 260) + 'ms">' + p + '</p>'
    ).join('');
    bodyEl.classList.remove('lang-en', 'lang-zh');
    bodyEl.classList.add('lang-' + lang);
    select.value = String(current);
    prevBtn.disabled = mPrev.disabled = current === 0;
    nextBtn.disabled = mNext.disabled = current === list.length - 1;
    document.title = chapterLabel(lang, current) + ' · 月亮与六便士';
    try { history.replaceState(null, '', '#' + lang + '-' + (current + 1)); } catch (e) {}
  };

  const render = (i, instant) => {
    const list = books[lang].chapters;
    i = Math.max(0, Math.min(i, list.length - 1));
    if (instant) {
      current = i;
      paint();
      return;
    }
    if (busy) return;
    busy = true;
    current = i;
    bodyEl.classList.add('fading');
    titleEl.style.opacity = '0';
    setTimeout(() => {
      paint();
      window.scrollTo(0, 0);
      bodyEl.classList.remove('fading');
      titleEl.style.opacity = '1';
      busy = false;
    }, 190);
  };

  const setLang = l => {
    if (!has(l) || l === lang) return;
    lang = l;
    localStorage.setItem('moon-lang', l);
    rebuildSelect();
    updateSeg();
    render(current);
  };

  // ---------- 事件 ----------
  langSeg.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => setLang(b.dataset.lang));
  });
  select.addEventListener('change', () => render(parseInt(select.value, 10)));
  prevBtn.addEventListener('click', () => { if (current > 0) render(current - 1); });
  nextBtn.addEventListener('click', () => { if (current < books[lang].chapters.length - 1) render(current + 1); });
  mPrev.addEventListener('click', () => { if (current > 0) render(current - 1); });
  mNext.addEventListener('click', () => { if (current < books[lang].chapters.length - 1) render(current + 1); });
  mTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'SELECT') return;
    if (e.key === 'ArrowLeft' && current > 0) render(current - 1);
    if (e.key === 'ArrowRight' && current < books[lang].chapters.length - 1) render(current + 1);
  });

  // ---------- 进度 ----------
  const onScroll = () => {
    const doc = document.documentElement;
    const max = doc.scrollHeight - window.innerHeight;
    const p = max > 0 ? Math.min(100, Math.max(0, (window.scrollY / max) * 100)) : 0;
    progressBar.style.width = p + '%';
    hdr.classList.toggle('scrolled', window.scrollY > 8);
  };
  window.addEventListener('scroll', onScroll, { passive: true });

  // ---------- 初始化 ----------
  const parseHash = () => {
    const m = location.hash.match(/^#(zh|en)-(\d+)$/);
    if (m && has(m[1])) return { lang: m[1], i: parseInt(m[2], 10) - 1 };
    const n = location.hash.match(/^#(\d+)$/);
    if (n) return { lang: null, i: parseInt(n[1], 10) - 1 };
    return { lang: null, i: 0 };
  };
  const init = parseHash();
  if (init.lang && init.lang !== lang) lang = init.lang;
  rebuildSelect();
  updateSeg();
  render(Math.max(0, init.i), true);
  onScroll();

  window.addEventListener('hashchange', () => {
    const h = parseHash();
    if (h.lang && h.lang !== lang && has(h.lang)) {
      lang = h.lang;
      rebuildSelect();
      updateSeg();
    }
    render(h.i, true);
  });
})();
</script>
</body>
</html>
